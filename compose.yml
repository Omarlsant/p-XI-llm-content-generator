services:
  # --- Backend Service ---
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: genai_backend
    ports:
      - "8000:8000"
    volumes:
      # Monta el código del backend para desarrollo
      - ./server:/app
      # Persiste la base de datos de Chroma fuera del contenedor
      - chroma_data:/app/chroma_db
      # Persiste la caché de HuggingFace/modelos para evitar descargas repetidas
      - hf_cache:/home/appuser/.cache/huggingface
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - API_KEY=${API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/content-agent/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Para que el backend pueda "ver" el Ollama corriendo en tu PC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --- Frontend Service ---
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: genai_frontend
    ports:
      - "5173:80" # Mapea el puerto 80 del contenedor a 5173 en tu máquina
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# --- Named Volumes for Data Persistence ---
volumes:
  chroma_data:
  hf_cache: